services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hominsu
      POSTGRES_PASSWORD: hominsu_dev_password
      POSTGRES_DB: hominsu
    ports:
      - "5432:5432"
    volumes:
      - hominsu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hominsu -d hominsu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hominsu_postgres_data:
