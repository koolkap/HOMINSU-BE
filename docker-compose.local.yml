services:
  postgres:
    image: postgres:15-alpine
    container_name: hominsu-postgres
    environment:
      POSTGRES_USER: hominsu
      POSTGRES_PASSWORD: hominsu_dev_password
      POSTGRES_DB: hominsu
    ports:
      - "5432:5432"
    volumes:
      - hominsu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hominsu -d hominsu"]
      interval: 5s
      timeout: 5s
      retries: 10

  srs:
    image: ossrs/srs:5
    container_name: hominsu-srs
    ports:
      - "1935:1935"   # RTMP ingest
      - "1985:1985"   # HTTP API / WebRTC
      - "8080:8080"   # HTTP / HLS playback
    volumes:
      - ./srs.conf:/usr/local/srs/conf/srs.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets SRS reach FastAPI on the host (Linux)
    depends_on:
      - postgres

volumes:
  hominsu_pgdata:
