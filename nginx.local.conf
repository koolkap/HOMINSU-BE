# Generated by scripts/setup_lan_network.py
# This is an HTTP reverse proxy. RTMP ingest continues to use SRS on port 1935.

events {}

http {
    default_type  application/octet-stream;
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       8088;
        server_name  192.168.219.53 localhost;

        # FastAPI REST API.
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FastAPI native WebSockets.
        location /ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # SRS-generated HLS playlists and segments.
        location /live/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control no-cache always;
        }

        location / {
            default_type application/json;
            return 404 '{"detail":"Hominsu LAN proxy is running"}';
        }
    }
}
